{% extends "base.html" %}

{% block title %}Register - Online Course Management Platform{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card shadow">
            <div class="card-header bg-primary text-white">
                <h4 class="mb-0"><i class="bi bi-person-plus"></i> Register</h4>
            </div>
            <div class="card-body">
                <form method="POST" action="{{ url_for('register') }}">
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="name" class="form-label">Full Name *</label>
                            <input type="text" class="form-control" id="name" name="name" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="email" class="form-label">Email Address *</label>
                            <input type="email" class="form-control" id="email" name="email" required>
                        </div>
                    </div>
                    
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="password" class="form-label">Password *</label>
                            <input type="password" class="form-control" id="password" name="password" required>
                        </div>
                        
                        <div class="col-md-6 mb-3">
                            <label for="phone_number" class="form-label">Phone Number *</label>
                            <div class="input-group">
                                <select class="form-select" style="max-width: 100px;" name="country_code" required>
                                    <option value="+91" selected>+91</option>
                                    <option value="+1">+1</option>
                                    <option value="+44">+44</option>
                                    <option value="+7">+7</option>
                                    <option value="+86">+86</option>
                                    <option value="+81">+81</option>
                                    <option value="+49">+49</option>
                                    <option value="+33">+33</option>
                                    <option value="+61">+61</option>
                                    <option value="+971">+971</option>
                                </select>
                                <input type="text" class="form-control" id="phone_number" name="phone_number" 
                                       placeholder="10 digit number" 
                                       pattern="\d{10}" 
                                       title="Please enter exactly 10 digits" 
                                       maxlength="10" 
                                       required>
                            </div>
                            <div class="form-text">Format: Country Code + 10 Digit Mobile Number</div>
                        </div>
                    </div>
                    
                    <div class="row">
                        <div class="col-md-4 mb-3">
                            <label for="country" class="form-label">Country</label>
                            <select class="form-select" id="country" name="country">
                                <option value="">Select Country...</option>
                                <option value="India" selected>India</option>
                                <option value="USA">USA</option>
                                <option value="Russia">Russia</option>
                                <option value="China">China</option>
                                <option value="UK">UK</option>
                                <option value="Germany">Germany</option>
                                <option value="France">France</option>
                                <option value="Japan">Japan</option>
                                <option value="Canada">Canada</option>
                                <option value="Australia">Australia</option>
                                <option value="Brazil">Brazil</option>
                                <option value="Italy">Italy</option>
                                <option value="South Korea">South Korea</option>
                                <option value="Spain">Spain</option>
                                <option value="Mexico">Mexico</option>
                                <option value="Indonesia">Indonesia</option>
                                <option value="Netherlands">Netherlands</option>
                                <option value="Saudi Arabia">Saudi Arabia</option>
                                <option value="Turkey">Turkey</option>
                                <option value="Switzerland">Switzerland</option>
                                <option value="Sweden">Sweden</option>
                                <option value="Poland">Poland</option>
                                <option value="Belgium">Belgium</option>
                                <option value="Thailand">Thailand</option>
                                <option value="Argentina">Argentina</option>
                                <option value="Norway">Norway</option>
                                <option value="Austria">Austria</option>
                                <option value="UAE">UAE</option>
                                <option value="Iran">Iran</option>
                                <option value="South Africa">South Africa</option>
                                <option value="Egypt">Egypt</option>
                                <option value="Denmark">Denmark</option>
                                <option value="Singapore">Singapore</option>
                                <option value="Malaysia">Malaysia</option>
                                <option value="Philippines">Philippines</option>
                                <option value="Vietnam">Vietnam</option>
                                <option value="Bangladesh">Bangladesh</option>
                                <option value="Pakistan">Pakistan</option>
                                <option value="Ireland">Ireland</option>
                                <option value="Israel">Israel</option>
                                <option value="Portugal">Portugal</option>
                                <option value="Czech Republic">Czech Republic</option>
                                <option value="Greece">Greece</option>
                                <option value="Finland">Finland</option>
                                <option value="New Zealand">New Zealand</option>
                                <option value="Romania">Romania</option>
                                <option value="Hungary">Hungary</option>
                                <option value="Ukraine">Ukraine</option>
                                <option value="Chile">Chile</option>
                            </select>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label for="gender" class="form-label">Gender</label>
                            <select class="form-select" id="gender" name="gender">
                                <option value="">Select...</option>
                                <option value="Male">Male</option>
                                <option value="Female">Female</option>
                                <option value="Other">Other</option>
                            </select>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label for="role" class="form-label">Role *</label>
                            <select class="form-select" id="role" name="role" required>
                                <option value="Student">Student</option>
                                <option value="Instructor">Instructor</option>
                            </select>
                        </div>
                    </div>
                    
                    <button type="submit" class="btn btn-primary w-100">
                        <i class="bi bi-person-plus"></i> Register
                    </button>
                </form>
                
                <div class="mt-3 text-center">
                    <p>Already have an account? <a href="{{ url_for('login') }}">Login here</a></p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
